# Pull-based self-host: published GHCR images + Postgres + local Docker computers.
# Drop this file and .env into any directory, then:
#   docker compose --env-file .env -f docker-compose.images.yml up -d
#
# Tag contract matches docs/self-host.md (edge from main; release tags when published).
# Default is edge because that tag is published on every main build (linux/amd64 + linux/arm64).
# Pin a published vX.Y.Z tag for a fixed version; `latest` moves to each new stable release.
# Default SANDBOX_PROVIDER=docker boots a local computer via the in-stack supervisor (no E2B key).
# Optional: set e2b / daytona / box plus the matching API key for remote computers.
name: rakazo

services:
  postgres:
    # Optional Hub override; unset keeps the digest-pinned official image.
    image: ${POSTGRES_IMAGE:-pgvector/pgvector:pg16-trixie@sha256:40d828eda66737aaacb934387a337babf1455ebd56e9bdd13fc08e211257c972}
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    pids_limit: 200
    mem_limit: 2g
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-rakazo}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-rakazo}
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-rakazo} -d ${POSTGRES_DB:-rakazo}"]
      interval: 5s
      timeout: 5s
      retries: 20

  # Pull-only stub so `compose up` fetches the published desktop image without a checkout.
  computer:
    image: ${RAKAZO_COMPUTER_IMAGE:-ghcr.io/elie222/rakazo/computer}:${RAKAZO_COMPUTER_IMAGE_TAG:-edge}
    command: ["true"]
    network_mode: none
    restart: "no"

  data-init:
    # Optional Hub override; unset keeps busybox:1.
    image: ${BUSYBOX_IMAGE:-busybox:1}
    command: ["chown", "-R", "1000:1000", "/data"]
    network_mode: none
    restart: "no"
    volumes:
      - appdata:/data

  # Runs from the app image. Not published as its own image and not exposed on the host:
  # access to the supervisor is equivalent to control of the Docker host.
  supervisor:
    image: ${RAKAZO_IMAGE:-ghcr.io/elie222/rakazo/app}:${RAKAZO_IMAGE_TAG:-edge}
    restart: unless-stopped
    command: ["pnpm", "--filter", "@rakazo/sandbox-supervisor", "start"]
    init: true
    user: root
    security_opt:
      - no-new-privileges:true
    pids_limit: 256
    mem_limit: 512m
    environment:
      NODE_ENV: production
      DATA_DIR: /data
      SUPERVISOR_HOST: "0.0.0.0"
      SUPERVISOR_PORT: "7091"
      DOCKER_SOCKET: /var/run/docker.sock
      RAKAZO_COMPUTER_IMAGE: ${RAKAZO_COMPUTER_IMAGE:-ghcr.io/elie222/rakazo/computer}:${RAKAZO_COMPUTER_IMAGE_TAG:-edge}
      RAKAZO_COMPUTER_MEMORY: ${RAKAZO_COMPUTER_MEMORY:-2g}
      RAKAZO_COMPUTER_CPUS: ${RAKAZO_COMPUTER_CPUS:-2}
      RAKAZO_COMPUTER_PIDS_LIMIT: ${RAKAZO_COMPUTER_PIDS_LIMIT:-2048}
      SANDBOX_COMMAND_TIMEOUT_MS: ${SANDBOX_COMMAND_TIMEOUT_MS:-300000}
      SANDBOX_SUPERVISOR_TOKEN: ${SANDBOX_SUPERVISOR_TOKEN:?Set SANDBOX_SUPERVISOR_TOKEN in .env}
      SANDBOX_SCREEN_NETWORK: isolated
      SANDBOX_COMPUTER_EGRESS: ${SANDBOX_COMPUTER_EGRESS:-restricted}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      LOG_FORMAT: ${LOG_FORMAT:-}
      AXIOM_TOKEN: ${AXIOM_TOKEN:-}
      AXIOM_DATASET: ${AXIOM_DATASET:-}
      AXIOM_EDGE: ${AXIOM_EDGE:-}
      AXIOM_EDGE_URL: ${AXIOM_EDGE_URL:-}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - appdata:/data
    networks:
      - app
    depends_on:
      computer:
        condition: service_completed_successfully
      data-init:
        condition: service_completed_successfully
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - fetch('http://127.0.0.1:7091/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))
      interval: 10s
      timeout: 5s
      retries: 20

  # Bundled S3-compatible object store (SeaweedFS, Apache-2.0) for artifacts and agent homes. It
  # runs only when COMPOSE_PROFILES includes bundled-s3, which new installs set in .env. An
  # upgraded install keeps local-disk artifacts until its admin opts in (docs/self-host.md).
  # Not published on the host. There are no default credentials: the store refuses to start unless RAKAZO_S3_ACCESS_KEY_ID and RAKAZO_S3_SECRET_ACCESS_KEY are set (letters and digits, at least 8 characters).
  seaweedfs:
    image: ${SEAWEEDFS_IMAGE:-chrislusf/seaweedfs:4.48}
    profiles: ["bundled-s3"]
    entrypoint:
      - sh
      - -c
      - |
        if [ "$${#AWS_ACCESS_KEY_ID}" -lt 8 ] || [ "$${#AWS_SECRET_ACCESS_KEY}" -lt 8 ]; then
          echo "Set RAKAZO_S3_ACCESS_KEY_ID and RAKAZO_S3_SECRET_ACCESS_KEY (at least 8 characters)" >&2
          exit 1
        fi
        exec weed server -dir=/data -s3 -s3.port=8333 -ip.bind=0.0.0.0 -master.volumeSizeLimitMB=1024
    restart: unless-stopped
    environment:
      AWS_ACCESS_KEY_ID: ${RAKAZO_S3_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${RAKAZO_S3_SECRET_ACCESS_KEY:-}
    volumes:
      - seaweedfsdata:/data
    networks:
      - data
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://localhost:9333/cluster/healthz"]
      interval: 5s
      timeout: 5s
      retries: 30

  # Creates the bucket (an S3 PUT; an existing bucket answers 409) and exits.
  seaweedfs-init:
    image: ${CURL_IMAGE:-curlimages/curl:8.22.0}
    profiles: ["bundled-s3"]
    restart: "no"
    entrypoint:
      - sh
      - -c
      - |
        if [ "$${#RAKAZO_S3_SECRET_ACCESS_KEY}" -lt 8 ]; then exit 1; fi
        for attempt in $$(seq 1 60); do
          code=$$(curl -s -o /dev/null -w '%{http_code}' --aws-sigv4 aws:amz:$${RAKAZO_S3_REGION}:s3 --user "$$RAKAZO_S3_ACCESS_KEY_ID:$$RAKAZO_S3_SECRET_ACCESS_KEY" -X PUT "http://seaweedfs:8333/$$RAKAZO_S3_BUCKET")
          if [ "$$code" = 200 ] || [ "$$code" = 409 ]; then exit 0; fi
          sleep 2
        done
        exit 1
    environment:
      RAKAZO_S3_ACCESS_KEY_ID: ${RAKAZO_S3_ACCESS_KEY_ID:-}
      RAKAZO_S3_SECRET_ACCESS_KEY: ${RAKAZO_S3_SECRET_ACCESS_KEY:-}
      RAKAZO_S3_BUCKET: ${RAKAZO_S3_BUCKET:-rakazo}
      RAKAZO_S3_REGION: ${RAKAZO_S3_REGION:-us-east-1}
    networks:
      - data
    depends_on:
      seaweedfs:
        condition: service_healthy

  # Applies migrations as the database owner, creates the runtime login, and exits. Only this
  # container gets the owner login: the API and worker connect as rakazo_app, which row-level
  # security binds, so code running in either cannot find a login that bypasses it.
  migrate:
    image: ${RAKAZO_IMAGE:-ghcr.io/elie222/rakazo/app}:${RAKAZO_IMAGE_TAG:-edge}
    command: ["pnpm", "db:migrate"]
    restart: "no"
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    pids_limit: 256
    mem_limit: 1536m
    environment:
      DATABASE_URL: postgres://rakazo_app:${POSTGRES_APP_PASSWORD:?Set POSTGRES_APP_PASSWORD in .env}@postgres:5432/${POSTGRES_DB:-rakazo}
      DATABASE_MIGRATION_URL: postgres://${POSTGRES_USER:-rakazo}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@postgres:5432/${POSTGRES_DB:-rakazo}
    networks:
      - data
    depends_on:
      postgres:
        condition: service_healthy

  api:
    image: ${RAKAZO_IMAGE:-ghcr.io/elie222/rakazo/app}:${RAKAZO_IMAGE_TAG:-edge}
    restart: unless-stopped
    command: ["pnpm", "--filter", "@rakazo/api", "start"]
    init: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    pids_limit: 256
    mem_limit: 1536m
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      SECRET_STORE: ${SECRET_STORE:-encrypted}
      INFISICAL_URL: ${INFISICAL_URL:-}
      INFISICAL_ALLOW_INSECURE_HTTP: ${INFISICAL_ALLOW_INSECURE_HTTP:-false}
      INFISICAL_CLIENT_ID: ${INFISICAL_CLIENT_ID:-}
      INFISICAL_CLIENT_SECRET: ${INFISICAL_CLIENT_SECRET:-}
      INFISICAL_PROJECT_ID: ${INFISICAL_PROJECT_ID:-}
      INFISICAL_ENVIRONMENT: ${INFISICAL_ENVIRONMENT:-}
      INFISICAL_FOLDER: ${INFISICAL_FOLDER:-}
      NODE_ENV: production
      API_HOST: "0.0.0.0"
      OIDC_ISSUER: ${OIDC_ISSUER:-}
      OIDC_CLIENT_ID: ${OIDC_CLIENT_ID:-}
      OIDC_CLIENT_SECRET: ${OIDC_CLIENT_SECRET:-}
      OIDC_NAME: ${OIDC_NAME:-SSO}
      OIDC_SCOPES: ${OIDC_SCOPES:-openid email profile}
      OIDC_ALLOW_SIGNUP_BYPASS: ${OIDC_ALLOW_SIGNUP_BYPASS:-false}
      # Public MCP address and extra trusted browser origins: API only.
      PUBLIC_MCP_URL:
      RAKAZO_TRUSTED_ORIGINS:
      AUTH_PASSWORD_ENABLED: ${AUTH_PASSWORD_ENABLED:-true}
      RAKAZO_DESKTOP_STACK_TOKEN: ${RAKAZO_DESKTOP_STACK_TOKEN:-}
      BETTER_AUTH_URL: ${BETTER_AUTH_URL:-http://127.0.0.1:5173}
      WEB_ORIGIN: ${WEB_ORIGIN:-http://127.0.0.1:5173}
      API_URL: ${API_URL:-http://127.0.0.1:5173}
      # The app's own login, subject to row-level security (docs/self-host.md#database-roles).
      DATABASE_URL: postgres://rakazo_app:${POSTGRES_APP_PASSWORD:?Set POSTGRES_APP_PASSWORD in .env}@postgres:5432/${POSTGRES_DB:-rakazo}
      DATA_DIR: /data
      SANDBOX_PROVIDER: ${SANDBOX_PROVIDER:-docker}
      CLOUD_AGENT_PROVIDER: ${CLOUD_AGENT_PROVIDER:-none}
      CLOUD_AGENT_SPACE_ID: ${CLOUD_AGENT_SPACE_ID:-}
      CURSOR_API_KEY: ${CURSOR_API_KEY:-}
      SANDBOX_SUPERVISOR_URL: http://supervisor:7091
      # Local desktop control: set only by the packaged desktop app on macOS.
      APP_CONTROL_PROVIDER: ${APP_CONTROL_PROVIDER:-}
      APP_CONTROL_BRIDGE_URL: ${APP_CONTROL_BRIDGE_URL:-}
      APP_CONTROL_BRIDGE_TOKEN: ${APP_CONTROL_BRIDGE_TOKEN:-}
      WAKEUP_DRIVER: graphile
      AGENT_RUNTIME: pi
      # Optional egress proxy (Mainland / corporate). Empty = unset; either case works.
      HTTP_PROXY: ${HTTP_PROXY:-${http_proxy:-}}
      HTTPS_PROXY: ${HTTPS_PROXY:-${https_proxy:-}}
      NO_PROXY: ${NO_PROXY:-${no_proxy:-}}
      http_proxy: ${http_proxy:-${HTTP_PROXY:-}}
      https_proxy: ${https_proxy:-${HTTPS_PROXY:-}}
      no_proxy: ${no_proxy:-${NO_PROXY:-}}
      # Pass-through: Compose fills each from .env when set. Only what this process reads.
      AI_GATEWAY_API_KEY:
      ANTHROPIC_API_KEY:
      ANTHROPIC_AUTH_TOKEN:
      ANTHROPIC_OAUTH_TOKEN:
      ANT_LING_API_KEY:
