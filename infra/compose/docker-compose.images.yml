      AXIOM_TOKEN:
      AZURE_OPENAI_API_KEY:
      BASETEN_API_KEY:
      BETTER_AUTH_SECRET:
      BLUEBUBBLES_PASSWORD:
      BLUEBUBBLES_URL:
      BLUEBUBBLES_WEBHOOK_TOKEN:
